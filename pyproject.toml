[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HtmlDownloader"
version = "1.0.1"
description = "HtmlDownloader downloads one HTML page and its stylesheets, scripts, and images."
readme = "README.md"
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*"
license = {text = "MIT"}
authors = [
    {name = "Wilgat Wong", email = "wilgat.wong@gmail.com"}
]
keywords = ["CLI", "TUI", "download", "HTML"]

dependencies = [
    "ChronicleLogger>=1.3.1",
]

# Official project links (this is what shows on PyPI!)
[project.urls]
Homepage = "https://github.com/cloudgen/HtmlDownloader"
Repository = "https://github.com/cloudgen/HtmlDownloader"
Issues = "https://github.com/cloudgen/HtmlDownloader/issues"

# This makes `html-downloader` command available after pip install
[project.scripts]
html-downloader = "HtmlDownloader.cli:main"